<!-- 月別読書一覧 -->

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>月別読書一覧</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="common.css">

    <style>
        /* ===== ヘッダー ===== */
        .header {
            display: flex;
            justify-content: center;
            padding: 0 16px;
            margin-bottom: 20px;
        }

        .header-inner {
            display: grid;
            grid-template-columns: 3fr 1.2fr;
            align-items: center;
        }

        /* ===== 月選択 ===== */
        select {
            font-size: 40px;
            padding: 4px 4px 4px 8px;
        }

        /* ===== 冊数 ===== */
        .count {
            font-size: 36px;
            color: #666;
            text-align: right;
        }

        /* ===== グリッド ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        /* ===== カード ===== */
        .card {
            text-align: center;
        }

        /* ===== 表紙 ===== */
        .cover {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 6px;
        }

        /* ===== 満足度 ===== */
        .rating {
            font-size: 22px;
        }
    </style>
</head>

<body>

    <!-- ===== ヘッダー ===== -->
    <div class="header">
        <div class="header-inner">
            <select id="monthSelect"></select>
            <span id="count" class="count"></span>
        </div>
    </div>

    <!-- ===== 読書一覧 ===== -->
    <div id="grid" class="grid"></div>

    <script type="module">

        // ===== 共通JavaScript読み込み =====
        import {
            fetchCSV,
            parseDate,
            getYearMonth,
            sortByDate
        } from "./common.js";

        // ===== データ =====
        let allData = [];

        // ===== 月リスト作成 =====
        function createMonthList(data) {

            const months = [
                ...new Set(

                    data

                        // 満足度ありのみ
                        .filter(d => d["満足度"])

                        // 終了日から年月を取得
                        .map(d => getYearMonth(d["終了日"]))

                        .filter(Boolean)

                        .map(d => d.label)
                )
            ];

            // 新しい月を上にする
            return months.sort((a, b) => {
                const [ay, am] = a.match(/\d+/g).map(Number);
                const [by, bm] = b.match(/\d+/g).map(Number);

                return by - ay || bm - am;
            });

        }

        // ===== 月選択プルダウン作成 =====
        function createMonthSelect(months) {

            const select = document.getElementById("monthSelect");
            select.innerHTML = "";

            months.forEach(month => {
                const option = document.createElement("option");
                option.value = month;
                option.textContent = month;

                select.appendChild(option);
            });

            select.addEventListener("change", render);

        }

        // ===== 表示処理 =====
        function render() {

            const selected = document.getElementById("monthSelect").value;
            const grid = document.getElementById("grid");
            const count = document.getElementById("count");

            // グリッド初期化
            grid.innerHTML = "";

            // ===== 月別抽出 =====
            const filtered = sortByDate(

                allData.filter(d => {

                    // 満足度ありのみ
                    if (!d["満足度"]) return false;

                    // 終了日から年月を取得
                    const ym = getYearMonth(d["終了日"]);

                    if (!ym) return false;

                    return ym.label === selected;

                })

            );

            // ===== 冊数表示 =====
            count.textContent = filtered.length + "冊";

            // ===== カード生成 =====
            filtered.forEach(d => {

                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <img
                        class="cover"
                        src="${d["カバーURL"]}"
                    >

                    <div class="rating">
                        ★ ${d["満足度"]}
                    </div>
                `;

                grid.appendChild(div);

            });

        }

        // ===== 初期処理 =====
        async function init() {

            try {

                // CSV取得
                allData = await fetchCSV();

                // 月リスト作成
                const months = createMonthList(allData);

                // データがない場合
                if (months.length === 0) {

                    document.getElementById("count").textContent = "0冊";

                    return;

                }

                // プルダウン作成
                createMonthSelect(months);

                // 初回表示
                render();

            } catch (error) {
                console.error("読書データの取得に失敗しました:", error);
                document.getElementById("count").textContent = 
                "取得エラー";
            }

        }

        init();

    </script>
</body>

</html>
